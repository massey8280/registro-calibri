<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Registro raccolta</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(./inter.woff2) format('woff2')}
:root{
  --bg:#0B1220; --panel:#121B2E; --panel2:#1A2740; --line:#26344D; --ink:#E8EEF8; --muted:#8B9DB8;
  --accent:#22D3EE; --accent-ink:#06222B; --salva:#34D399; --avviso:#FB7185; --stima:#FBBF24;
  --grossa:#E8EEF8; --mezzana:#60A5FA; --semina:#34D399; --mista:#C084FC;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","Droid Sans Mono",monospace;
  --fs:16px; --tap:46px; --chip:38px; --calh:48px; --calfs:15px; --calcols:4; --h2m:18px; --pad:12px; --key:54px; --r:10px;
}
body.barca{ --fs:18px; --tap:56px; --chip:48px; --calh:64px; --calfs:20px; --calcols:2; --h2m:22px; --pad:14px; --key:64px; --r:12px; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.4 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.badge{overflow:hidden;text-overflow:ellipsis;max-width:55%}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.has-bar{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
h1::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:1px;box-shadow:0 0 8px var(--accent)}
h2{font-family:var(--mono);font-size:11px;font-weight:600;margin:var(--h2m) 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
h2 .s{font-family:'Inter',system-ui,sans-serif;text-transform:none;letter-spacing:0;font-weight:500}
b{font-weight:700}
button{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:var(--r);min-height:var(--tap);padding:0 12px;cursor:pointer;text-align:center;line-height:1.15;font-weight:600}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.salva{background:var(--salva);border-color:var(--salva);color:#052E1C;font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);font-weight:600;padding:0 8px}
button.danger{color:var(--avviso)}
button.mini{min-height:32px;padding:0 10px;font-size:13px;border-radius:16px}
button[disabled]{opacity:.35}
.wrap{padding:8px 14px 0;max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.badge{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.04em;background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:6px}
.view{display:none}.view.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips>button{min-height:var(--chip);padding:0 14px;border-radius:8px;font-weight:500}
.chips>button.on{font-weight:700}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;min-height:var(--tap);margin-top:8px;cursor:pointer}
.field .lab{color:var(--muted);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.field .val{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--accent)}
input[type=date]{font:inherit;font-family:var(--mono);font-size:17px;font-weight:600;border:0;background:transparent;color:var(--accent);min-height:36px;text-align:right;color-scheme:dark}
input[type=text]{font:inherit;border:1px solid var(--line);border-radius:var(--r);min-height:var(--tap);padding:0 12px;width:100%;color:var(--ink);background:var(--panel)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
input::placeholder{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(var(--calcols),1fr);gap:8px}
.cal>button{min-height:var(--calh);font-size:var(--calfs);font-weight:700;padding:0 4px}
.cal>button[data-v="grossa"].on{background:var(--grossa);border-color:var(--grossa);color:var(--bg)}
.cal>button[data-v="mezzana"].on{background:var(--mezzana);border-color:var(--mezzana);color:var(--bg)}
.cal>button[data-v="semina"].on{background:var(--semina);border-color:var(--semina);color:var(--bg)}
.cal>button[data-v="mista"].on{background:var(--mista);border-color:var(--mista);color:var(--bg)}
.cal>button.add{background:transparent;border-style:dashed}
.cal>button.add.grossa{color:var(--grossa);border-color:var(--grossa)}.cal>button.add.mezzana{color:var(--mezzana);border-color:var(--mezzana)}.cal>button.add.semina{color:var(--semina);border-color:var(--semina)}.cal>button.add.mista{color:var(--mista);border-color:var(--mista)}
textarea#f-testo{width:100%;font:inherit;font-size:17px;line-height:1.4;border:1px solid var(--accent);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:10px 12px;min-height:64px;resize:vertical}
textarea#f-testo:focus{outline:2px solid var(--accent);border-color:transparent}
textarea::placeholder{color:var(--muted)}
.calpill{font-weight:700;min-height:34px;padding:0 12px;border-radius:6px;border:1px solid;background:transparent;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.calpill.grossa{color:var(--grossa);border-color:var(--grossa)}.calpill.mezzana{color:var(--mezzana);border-color:var(--mezzana)}.calpill.semina{color:var(--semina);border-color:var(--semina)}.calpill.mista{color:var(--mista);border-color:var(--mista)}
.riga{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:var(--pad);margin-top:10px;position:relative;overflow:hidden}
.riga::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.riga.grossa::before{background:var(--grossa)}.riga.mezzana::before{background:var(--mezzana)}.riga.semina::before{background:var(--semina)}.riga.mista::before{background:var(--mista)}
.t{font-size:16px;font-weight:700}
.s{color:var(--muted);font-size:14px}
.inline{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.inline .field{flex:1;margin-top:0;min-width:0}
.inline .chips{flex:0 0 auto}
.inline .chips>button{padding:0 10px}
.inline .field .val{font-size:17px}
.destsum{display:block;width:100%;text-align:left;margin-top:8px;min-height:40px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);font-weight:500;font-size:14px;line-height:1.4;color:var(--ink)}
.destsum .s{color:var(--accent);font-weight:600}
.destbox{margin-top:8px}
.cal.cal2{grid-template-columns:1fr 1fr}
.riga.chiusa{padding:0}
.rigasum{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;min-height:52px;flex-wrap:wrap}
.rigasum .calpill{min-height:28px;font-size:12px;padding:0 10px}
.rigasum b{font-family:var(--mono);font-size:16px;color:var(--accent)}
.rigasum .dsum{flex-basis:100%;font-weight:500;padding-left:2px}
.port{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.row.dest>button{min-height:var(--tap);font-weight:600;padding:0 4px}
.right{display:flex;justify-content:flex-end;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));padding:10px 14px;background:var(--bg);border-top:1px solid var(--line);display:none;gap:8px;z-index:6}
.bar>button{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav.tabs>button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);min-height:56px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
nav.tabs>button.on{color:var(--accent);background:transparent;box-shadow:inset 0 2px 0 var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 3px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;line-height:1.3;white-space:nowrap}
td{font-family:var(--mono)}
td:first-child{font-family:'Inter',system-ui,sans-serif}
th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;font-family:var(--mono)}
td:first-child,th:first-child{text-align:left}
td.grossa,td.mezzana,td.semina,td.mista{font-weight:600}
td.grossa{color:var(--grossa)} td.mezzana{color:var(--mezzana)} td.semina{color:var(--semina)} td.mista{color:var(--mista)}
.ns{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
table.gen{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;border-collapse:separate;border-spacing:0}
table.gen td,table.gen th{font-size:15px;padding:10px 12px;border-bottom:1px solid var(--line)}
table.gen tr:last-child td{border-bottom:0}
table.gen td{font-weight:600;font-size:16px;white-space:nowrap;color:var(--ink)}
table.gen td:first-child{white-space:normal;width:36%;color:var(--muted);font-weight:500;font-size:13px}
table.gen .nos{background:var(--panel2);color:var(--accent)}
table.gen th.nos{color:var(--accent)}
.stim{color:var(--stima);font-weight:600}
.empty{color:var(--muted);padding:14px 0}
.warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#FDE68A;padding:10px 12px;border-radius:10px;margin-top:8px;font-size:14px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ev{padding:4px 0 4px 14px;position:relative;margin-top:4px;font-size:15px}
.ev::before{content:'';position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.ev.grossa::before{background:var(--grossa)} .ev.mezzana::before{background:var(--mezzana)} .ev.semina::before{background:var(--semina)} .ev.mista::before{background:var(--mista)}
.ev.ann,.grp.ann .ev{text-decoration:line-through;color:var(--muted)}
button.inc{border-color:var(--salva);color:var(--salva);margin-left:6px;vertical-align:middle}
.grp.ann{background:transparent;border-style:dashed}
.lista{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lista .it{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.lista .it:last-child{border-bottom:0}
.lista .it .nome{flex:1;font-weight:600}
.lista .it .quota{color:var(--accent);font-size:12px;font-weight:600;font-family:var(--mono)}
.lista .it button.x{border:0;background:transparent;color:var(--muted);min-height:40px;min-width:40px;padding:0;font-size:16px}
.lista .it button.nome{border:0;background:transparent;text-align:left;padding:0;flex:1;font-weight:600;min-height:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}
.card .kv span:first-child{color:var(--muted)}
.card .kv b{font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600;color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(3,7,18,.6);z-index:19;display:none}.scrim.on{display:block}
.pad{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:20;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none}
.pad.on{display:block}
.pad .disp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 4px 10px}
.pad .disp .n{font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;min-height:40px;color:var(--accent)}
.pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .keys>button{min-height:var(--key);font-size:22px;font-weight:600;background:var(--panel2);font-family:var(--mono)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(130px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);padding:12px 16px;border-radius:10px;font-weight:700;z-index:30;display:none}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:900px){
  body{padding-left:220px;padding-bottom:40px}
  body.has-bar{padding-bottom:110px}
  .wrap{max-width:760px;margin:0 auto;padding:16px 32px 0}
  header.top{padding:18px 32px;position:static}
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
  nav.tabs>button{flex:0 0 auto;text-align:left;padding:0 16px;min-height:44px;border-radius:8px;font-size:12px}
  nav.tabs>button.on{box-shadow:none;background:var(--panel2)}
  nav.tabs::before{content:'Registro raccolta';display:block;color:var(--ink);font-weight:700;font-size:14px;padding:0 16px 20px}
  .bar{left:220px;padding:12px 32px}
  .bar>button.salva{max-width:360px}
  .pad{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:360px;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:16px}
  .toast{left:auto;right:32px;bottom:32px;max-width:420px}
  button:hover{border-color:var(--accent)}
  button.on:hover,button.primary:hover,button.salva:hover{filter:brightness(1.08)}
  .cal.cal2{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header class="top"><h1>Registro raccolta</h1><span class="badge" id="badge"></span></header>
<main class="wrap">
  <section class="view on" id="v-nuova">
    <div id="nuova-banner"></div>
    <h2>Scrivi qui</h2>
    <textarea id="f-testo" rows="2" placeholder="es. codigoro: 200 kg grossa finittica 11 incassato, 14 coffe mezzana bassamarea" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div id="nuova-note"></div>
    <div id="nuova-form"></div>
  </section>
  <section class="view" id="v-totali"></section>
  <section class="view" id="v-registro"></section>
  <section class="view" id="v-impostazioni"></section>
</main>
<div class="bar" id="bar"></div>
<nav class="tabs">
  <button data-a="tab" data-v="nuova" class="on">Nuova</button>
  <button data-a="tab" data-v="totali">Totali</button>
  <button data-a="tab" data-v="registro">Registro</button>
  <button data-a="tab" data-v="impostazioni">Altro</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="pad" id="pad">
  <div class="disp"><span id="pad-title" class="s"></span><span id="pad-val" class="n"></span></div>
  <div class="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k=",">,</button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button data-k="clear" class="ghost" style="flex:0 0 auto">Vuoto</button>
    <button data-k="close">Annulla</button>
    <button data-k="ok" class="primary">OK</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const VERSION='0.10.3';
const CALIBRI=['grossa','mezzana','semina','mista'];
const NOME={grossa:'Grossa',mezzana:'Mezzana',semina:'Semina',mista:'Mista'};
const ORD={grossa:0,mezzana:1,semina:2,mista:3};
function ordinaRighe(righe){ return righe.sort((a,b)=>(ORD[a.calibro]==null?9:ORD[a.calibro])-(ORD[b.calibro]==null?9:ORD[b.calibro])); }
const DEST_DEFAULT={grossa:'venduta',mezzana:'riseminata',semina:'riseminata',mista:'riseminata'};
const TAB={nuova:'v-nuova',totali:'v-totali',registro:'v-registro',impostazioni:'v-impostazioni'};

// ===== PURE =====
function round2(n){return Math.round(n*100)/100}
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s===''||s==='.') return null; const n=Number(s); return Number.isFinite(n)?n:null; }
function fmt(n,d=1){ if(n==null||!Number.isFinite(n)) return '?'; return n.toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:d}); }
function fmtEuro(n){ if(n==null||!Number.isFinite(n)) return '?'; return n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function fmtData(iso){ if(!iso) return '?'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function oggiISO(){ return isoLocal(new Date()); }
function giornoSett(iso){ const d=new Date(iso+'T12:00:00'); return ['dom','lun','mar','mer','gio','ven','sab'][d.getDay()]; }
function uuid(){ if(typeof crypto!=='undefined'&&crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normVivai(list){ return (list||[]).map(v=>typeof v==='string'?{nome:v,quota_pct:100}:{nome:v.nome,quota_pct:v.quota_pct==null?100:v.quota_pct}); }
function quotaVivaio(S,nome){ const v=S.vivai.find(x=>x.nome===nome); return v?v.quota_pct:100; }
function qtaRiga(r){ if(r.unita==='lordo'){ if(r.lordo==null||r.colli==null||r.tara==null) return null; return round2(r.lordo-r.colli*r.tara); } return r.qta; }
function unitaRiga(r){ return r.unita==='coffe'?'coffe':'kg'; }
function portionsWithResto(r,q){ const ps=r.dest; let used=0; return ps.map((p,i)=>{ if(i<ps.length-1){ used+=p.qta||0; return Object.assign({},p,{qta:p.qta||0}); } return Object.assign({},p,{qta:round2((q||0)-used)}); }); }

function buildEventi(F,S){ const ts=new Date().toISOString(); const gruppo=uuid(); const out=[];
  ordinaRighe(F.righe.slice()).forEach(r=>{ const q=qtaRiga(r); const ps=portionsWithResto(r,q);
    ps.forEach(p=>{ out.push({
      id:uuid(), gruppo, ts, device:S.device, tipo:'raccolta', data:F.data,
      origine_vivaio:F.origine, origine_punto:null, quota_pct:F.quota,
      calibro:r.calibro, split_mezzana_pct:r.calibro==='mista'?r.split:null,
      qta:round2(p.qta), unita:r.unita==='lordo'?'kg':r.unita,
      fattore_coffa:r.unita==='coffe'?S.fattore_coffa:null,
      lordo_kg:r.unita==='lordo'?r.lordo:null, colli:r.unita==='lordo'?r.colli:null, tara_collo:r.unita==='lordo'?r.tara:null,
      dest:p.dest, dest_vivaio:p.dest==='riseminata'?(p.vivaio||'?'):null, dest_punto:null,
      compratore:p.dest==='venduta'?(p.compratore||'?'):null, prezzo_kg:p.dest==='venduta'?p.prezzo:null,
      incassata_il:(p.dest==='venduta'&&p.incassata)?F.data:null, sostituisce_id:null }); }); });

  // niente config e niente impostazioni locali: ricavo vivai, compratori e quote dalle raccolte già salvate
  if(!(S.vivai&&S.vivai.length)&&!(S.compratori&&S.compratori.length)){ const vq={}; const cs=new Set();
    for(const e of eventiAttivi(E)){ const o=e.origine_vivaio; if(o&&o!=='?'){ (vq[o]||(vq[o]={})); const q=e.quota_pct==null?100:e.quota_pct; vq[o][q]=(vq[o][q]||0)+1; } const d=e.dest_vivaio; if(d&&d!=='?'&&!vq[d]) vq[d]={}; if(e.compratore&&e.compratore!=='?') cs.add(e.compratore); }
    S.vivai=Object.keys(vq).sort().map(nome=>{ const qs=vq[nome]; let best=100,bn=-1; for(const q in qs){ if(qs[q]>bn){ bn=qs[q]; best=+q; } } return {nome,quota_pct:best}; });
    S.compratori=[...cs].sort(); }
  normVivai(S.vivai).forEach(v=>evs.push(mk({chiave:'vivaio',nome:v.nome,quota_pct:v.quota_pct,azione:'set'})));
  (S.compratori||[]).forEach(c=>evs.push(mk({chiave:'compratore',nome:c,azione:'set'})));
  if(S.fattore_coffa&&S.fattore_coffa!==25) evs.push(mk({chiave:'fattore_coffa',valore:S.fattore_coffa}));
  if(S.tara_collo!=null) evs.push(mk({chiave:'tara_collo',valore:S.tara_collo}));
  if(!evs.length) return; await DB.putMany('eventi',evs); E.push(...evs); accoda(evs.map(e=>e.id)); await salvaImp(); }
function nomiVivai(){ return S.vivai.map(v=>v.nome); }

function fieldBtn(lab,val,a,d={}){ return '<div class="field" data-a="'+a+'" '+dataAttrs(d)+'><span class="lab">'+lab+'</span><span class="val">'+val+'</span></div>'; }

function rigaCard(r,i){ const q=qtaRiga(r); const u=unitaRiga(r); let corpo='';
  if(r.chiusa&&q!=null){ const ps=portionsWithResto(r,q); const molte=ps.length>1;
    return '<div class="riga '+r.calibro+' chiusa"><button class="rigasum" data-a="riga-apri" data-i="'+i+'"><span class="calpill '+r.calibro+'">'+NOME[r.calibro]+'</span><b>'+fmt(q,2)+' '+u+'</b>'+(r.calibro==='mista'?'<span class="s"> · mezz. '+(r.split==null?'?':fmt(r.split,0)+' %')+'</span>':'')+'<span class="s dsum">→ '+ps.map(p=>descPort(p,u,molte)).join(' · ')+'</span></button></div>'; }
  const testa=r.cambia
    ?'<div class="cal">'+CALIBRI.map(c=>btn(NOME[c],'riga-cal',{i,v:c},r.calibro===c?'on':'')).join('')+'</div>'
    :'<div class="row" style="align-items:center;gap:8px"><button class="calpill '+r.calibro+'" data-a="riga-cambia" data-i="'+i+'" style="flex:0 0 auto">'+NOME[r.calibro]+'</button>'
      +(r.calibro==='mista'?splitChips(r,i):'<span class="s">'+(q==null?'':fmt(q,2)+' '+u)+'</span>')+'<button class="ghost danger mini" data-a="riga-del" data-i="'+i+'" style="margin-left:auto">Togli</button></div>';
  const unitaChips='<div class="chips">'+[['kg','kg'],['coffe','coffe'],['lordo','lordo']].map(([v,l])=>btn(l,'riga-unita',{i,v},r.unita===v?'on':'')).join('')+'</div>';
  if(r.unita==='lordo'){ corpo='<div class="inline">'+fieldBtn('Lordo',r.lordo==null?'—':fmt(r.lordo,2)+' kg','riga-lordo',{i})+unitaChips+'</div>'
    +'<div class="inline">'+fieldBtn('Colli',r.colli==null?'—':fmt(r.colli,0),'riga-colli',{i})+fieldBtn('Tara/collo',r.tara==null?'—':fmt(r.tara,2)+' kg','riga-tara',{i})+'</div>'
    +'<div class="s" style="margin-top:6px">Netto: <b>'+(q==null?'—':fmt(q,2)+' kg')+'</b></div>'; }
  else corpo='<div class="inline">'+fieldBtn('Quantità',r.qta==null?'—':fmt(r.qta,2)+' '+u,'riga-qta',{i})+unitaChips+'</div>';
  return '<div class="riga '+r.calibro+'">'+testa+corpo+(r.apri?destEditor(r,i):destSummary(r,i))+(q!=null?'<div class="right" style="margin-top:6px"><button class="mini" data-a="riga-chiudi" data-i="'+i+'">Fatto</button></div>':'')+'</div>'; }

function splitChips(r,i){ const opts=['?','50','60','70','80']; const cur=r.split==null?'?':String(r.split); const other=r.split!=null&&!opts.includes(cur);
  return '<div class="chips" style="flex:1">'+opts.map(o=>btn(o==='?'?'mezz. ?':o+' %','riga-split',{i,v:o},cur===o?'on':'')).join('')+btn(other?fmt(r.split,0)+' %':'altro…','riga-split',{i,v:'altro'},other?'on':'')+'</div>'; }

function descPort(p,u,molte){ let d=''; if(p.dest==='venduta') d='venduta a '+esc(p.compratore||'?')+(p.prezzo!=null?' · '+fmt(p.prezzo,2)+' €/kg':' · prezzo ?')+(p.incassata?' · incassata':'');
  else if(p.dest==='riseminata') d='riseminata in '+esc(p.vivaio||'?'); else d='da assegnare';
  return (molte?'<b>'+fmt(p.qta,2)+' '+u+'</b> ':'')+d; }
function destSummary(r,i){ const q=qtaRiga(r); const u=unitaRiga(r); const ps=portionsWithResto(r,q); const molte=ps.length>1;
  return '<button class="destsum" data-a="p-apri" data-i="'+i+'">→ '+ps.map(p=>descPort(p,u,molte)).join('<br>→ ')+'<span class="s" style="float:right">cambia</span></button>'; }

function destRow(sel,i,j){ return '<div class="row dest">'+[['riseminata','Riseminata'],['venduta','Venduta'],['da_assegnare','Da assegnare']].map(([v,l])=>btn(l,'p-dest',{i,j,v},sel===v?'on':'')).join('')+'</div>'; }
function destEditor(r,i){ const q=qtaRiga(r); const u=unitaRiga(r); const ps=portionsWithResto(r,q); const resto=ps[ps.length-1].qta; const molte=r.dest.length>1;
  const parts=r.dest.map((p,j)=>{ const last=j===r.dest.length-1; let inner='';

      +'<div class="inline">'+fieldBtn('€/kg',p.prezzo==null?'?':fmt(p.prezzo,2),'p-prezzo',{i,j})+'<div class="chips">'+btn(p.incassata?'Incassata':'Da incassare','p-inc',{i,j},p.incassata?'on':'')+'</div></div>';

    return '<div class="port">'+destRow(p.dest,i,j)+qh+inner+(molte?'<div class="right"><button class="ghost danger mini" data-a="p-del" data-i="'+i+'" data-j="'+j+'">Togli parte</button></div>':'')+'</div>'; }).join('');

// un numero solo: somma certo+stimato, con ≈ davanti se c'è una stima dentro
function numK(o,d){ d=d==null?0:d; const t=(o.c||0)+(o.s||0); return (o.s?'<span class="stim">≈</span>':'')+fmt(t,d); }
function numE(o){ const t=(o.c||0)+(o.s||0); return (o.s?'<span class="stim">≈</span>':'')+fmtEuro(t); }
function sommaT(T){ const g=vuotoT(); g.incassato=0; CALIBRI.forEach(c=>{ const t=T[c]; if(!t) return; ['raccolto','venduto','riseminato','da_assegnare'].forEach(k=>{ g[k].c+=t[k].c; g[k].s+=t[k].s; }); g.euro.c+=t.euro.c; g.euro.s+=t.euro.s; g.euro.senza+=t.euro.senza; }); return g; }

  el.innerHTML=fchips

function renderRegistro(){ const el=document.getElementById('v-registro'); const ann=new Set(E.filter(e=>e.tipo==='annulla').map(e=>e.annulla_id)); const racc=E.filter(e=>e.tipo==='raccolta');

  const G={}; racc.forEach(e=>{ if(ann.has(e.id)&&sostituiti.has(e.id)) return; (G[e.gruppo]||(G[e.gruppo]=[])).push(e); });
  const tutti=Object.values(G).sort((a,b)=>(b[0].data+b[0].ts).localeCompare(a[0].data+a[0].ts));
  const nAnn=tutti.filter(g=>g.every(e=>ann.has(e.id))).length;

      if(e.dest==='venduta') d='venduta a '+esc(e.compratore||'?')+(e.prezzo_kg!=null?' · '+fmt(e.prezzo_kg,2)+' €/kg':' · prezzo ?')+(e.incassata_il?' · incassata '+fmtData(e.incassata_il).slice(0,5):(!a?' <button class="mini inc" data-a="incassato" data-v="'+e.id+'">Incassato</button>':' · da incassare'));
      else if(e.dest==='riseminata') d='riseminata in '+esc(e.dest_vivaio||'?'); else d='da assegnare';
      const m=e.calibro==='mista'?(e.split_mezzana_pct!=null?' (≈'+fmt(e.split_mezzana_pct,0)+' % mezz.)':' (split ?)'):'';

async function scaricaCsv(){ const c=syncCfg(); try{ const r=await fetch('./api/export.csv',{headers:{'Authorization':'Bearer '+c.token}}); if(!r.ok) throw new Error('server '+r.status); const blob=await r.blob(); const name='registro-raccolta-'+oggiISO().replace(/-/g,'')+'.csv';
    if(navigator.canShare&&typeof File!=='undefined'){ const file=new File([blob],name,{type:'text/csv'}); if(navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e&&e.name==='AbortError') return; } } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Scaricato '+name); }
  catch(e){ toast('CSV non scaricato: '+(e&&e.message?e.message:e)); } }

// ----- validazione e salvataggio -----
function validaPasso1(){ if(!F.data) return 'Manca la data'; if(!F.righe.length) return 'Aggiungi almeno un calibro';
  for(let k=0;k<F.righe.length;k++){ const r=F.righe[k]; if(!r.calibro) return 'Riga '+(k+1)+': scegli il calibro';
    if(r.unita==='lordo'&&(r.lordo==null||r.colli==null||r.tara==null)) return 'Riga '+(k+1)+': servono lordo, colli e tara';
    const q=qtaRiga(r); if(q==null||q<=0) return 'Riga '+(k+1)+': quantità mancante o zero'; } return null; }
function validaPasso2(){ for(const r of F.righe){ const q=qtaRiga(r); const ps=portionsWithResto(r,q);
    for(let j=0;j<ps.length;j++){ const p=ps[j]; if(!p.dest) return NOME[r.calibro]+': scegli la destinazione'; if(j<ps.length-1&&(p.qta==null||p.qta<=0)) return NOME[r.calibro]+': quantità della parte '+(j+1)+' mancante'; }
    if(ps[ps.length-1].qta<0) return NOME[r.calibro]+': le parti superano '+fmt(q,2);
    if(ps.length>1&&ps[ps.length-1].qta===0) return NOME[r.calibro]+': il resto è 0, togli l\'ultima destinazione'; } return null; }
async function salva(){ const err=validaPasso1()||validaPasso2(); if(err){ toast(err); return; } const ev=buildEventi(F,S); let extra=[];
  if(F.sostituisce_gruppo){ const g=F.sostituisce_gruppo; const ann=new Set(E.filter(e=>e.tipo==='annulla').map(e=>e.annulla_id)); const old=E.filter(e=>e.tipo==='raccolta'&&e.gruppo===g&&!ann.has(e.id)); const ts=new Date().toISOString();
    extra=old.map(t=>({id:uuid(),ts,device:S.device,tipo:'annulla',annulla_id:t.id,gruppo:g,motivo:'modifica'})); ev.forEach(e=>{ e.sostituisce_gruppo=g; }); }
  try{ await DB.putMany('eventi',extra.concat(ev)); E.push(...extra,...ev); accoda(extra.concat(ev).map(e=>e.id)); await salvaImp(); sync(); const mod=!!F.sostituisce_gruppo; F=nuovoForm(); toast(mod?'Modifica salvata':'Salvata: '+ev.length+(ev.length===1?' evento':' eventi')); render(); window.scrollTo(0,0); }
  catch(e){ toast('Non salvato: '+(e&&e.message?e.message:e)); } }
async function segnaIncassato(id){ const e=E.find(x=>x.id===id&&x.tipo==='raccolta'); if(!e) return; const ts=new Date().toISOString();
  const nuovo=Object.assign({},e,{id:uuid(),ts,device:S.device,incassata_il:oggiISO(),sostituisce_id:e.id});
  const ann={id:uuid(),ts,device:S.device,tipo:'annulla',annulla_id:e.id,gruppo:e.gruppo,motivo:'incasso'};
  try{ await DB.putMany('eventi',[ann,nuovo]); E.push(ann,nuovo); accoda([ann.id,nuovo.id]); await salvaImp(); sync(); toast('Segnata incassata'); render(); }catch(err){ toast('Non salvato: '+(err&&err.message?err.message:err)); } }
async function annullaGruppo(g){ const ann=new Set(E.filter(e=>e.tipo==='annulla').map(e=>e.annulla_id)); const targets=E.filter(e=>e.tipo==='raccolta'&&e.gruppo===g&&!ann.has(e.id)); if(!targets.length) return;
  const ts=new Date().toISOString(); const evs=targets.map(t=>({id:uuid(),ts,device:S.device,tipo:'annulla',annulla_id:t.id,gruppo:g}));
  try{ await DB.putMany('eventi',evs); E.push(...evs); accoda(evs.map(e=>e.id)); await salvaImp(); sync(); toast('Raccolta annullata'); render(); }catch(e){ toast('Non annullata: '+(e&&e.message?e.message:e)); } }
async function nuovoNome(titolo,lista){ const n=(window.prompt(titolo)||'').trim(); if(!n) return null;
  if(lista==='vivai'){ if(!S.vivai.some(v=>v.nome===n)) await config({chiave:'vivaio',nome:n,quota_pct:100,azione:'set'}); }
  else if(!S.compratori.includes(n)) await config({chiave:'compratore',nome:n,azione:'set'}); return n; }

async function esporta(){ const payload={schema:1,app:'registro-raccolta',versione:VERSION,esportato_il:new Date().toISOString(),device:S.device,impostazioni:Object.assign({},S,{sync:Object.assign({},syncCfg(),{token:''})}),eventi:E};
  const txt=JSON.stringify(payload,null,1); const name='registro-raccolta-'+oggiISO().replace(/-/g,'')+'.json';
  if(navigator.canShare&&typeof File!=='undefined'){ try{ const file=new File([txt],name,{type:'application/json'}); if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('File scaricato: '+name); }
async function importa(file){ let p; try{ p=JSON.parse(await file.text()); }catch(e){ toast('File non leggibile: non è JSON'); return; }
  const list=Array.isArray(p)?p:(p&&p.eventi); if(!Array.isArray(list)){ toast('Nel file non c\'è la lista "eventi"'); return; }
  const validi=list.filter(e=>e&&typeof e.id==='string'&&(e.tipo==='raccolta'||e.tipo==='annulla'||e.tipo==='config'));
  let n=0; try{ n=await DB.addMany('eventi',validi); }catch(e){ toast('Import fallito: '+(e&&e.message?e.message:e)); return; }
  E=await DB.all('eventi'); E.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  if(p&&p.impostazioni&&!E.some(e=>e.tipo==='config')){ S.vivai=normVivai(p.impostazioni.vivai); S.compratori=p.impostazioni.compratori||[]; S.fattore_coffa=p.impostazioni.fattore_coffa||25; S.tara_collo=p.impostazioni.tara_collo==null?null:p.impostazioni.tara_collo; await migraConfigLocale(); }
  applicaConfig(); await salvaImp();
  accoda(validi.map(e=>e.id)); await salvaImp(); sync();
  toast('Importati '+n+' eventi nuovi, '+(validi.length-n)+' già presenti'); render(); }

// ----- numpad -----
const Pad={cb:null,val:'',dec:2,fresh:false,
  open(title,cur,cb,opts={}){ Pad.cb=cb; Pad.dec=opts.dec==null?2:opts.dec; Pad.val=cur==null?'':String(cur).replace('.',','); Pad.fresh=Pad.val!==''; document.getElementById('pad-title').textContent=title; Pad.draw(); document.getElementById('pad').classList.add('on'); document.getElementById('scrim').classList.add('on'); },
  draw(){ document.getElementById('pad-val').textContent=Pad.val||'—'; },
  key(k){ if(Pad.fresh){ Pad.fresh=false; Pad.val=''; if(k==='del'){ Pad.draw(); return; } }
    if(k==='del') Pad.val=Pad.val.slice(0,-1);
    else if(k===','){ if(Pad.dec>0&&!Pad.val.includes(',')) Pad.val=(Pad.val||'0')+','; }
    else { if(Pad.val.includes(',')&&Pad.val.split(',')[1].length>=Pad.dec) return; if(Pad.val.length>=9) return; Pad.val=Pad.val==='0'?k:Pad.val+k; }
    Pad.draw(); },
  ok(){ const n=parseNum(Pad.val); const cb=Pad.cb; Pad.close(); if(cb) cb(n); },
  close(){ document.getElementById('pad').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); Pad.cb=null; } };
document.getElementById('pad').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
  if(k==='ok') Pad.ok(); else if(k==='close') Pad.close(); else if(k==='clear'){ Pad.val=''; Pad.draw(); } else Pad.key(k); });
document.getElementById('scrim').addEventListener('click',()=>Pad.close());
document.addEventListener('keydown',e=>{ const aperto=document.getElementById('pad').classList.contains('on');
  if(aperto){ if(/^[0-9]$/.test(e.key)) Pad.key(e.key); else if(e.key===','||e.key==='.') Pad.key(','); else if(e.key==='Backspace') Pad.key('del'); else if(e.key==='Enter') Pad.ok(); else if(e.key==='Escape') Pad.close(); else return; e.preventDefault(); return; }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&vista==='nuova'&&F.righe.length){ e.preventDefault(); salva(); } });

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2800); }

  if(t.id==='f-data'){ if(t.value) F.data=t.value; }
  else if(t.id==='f-device'){ S.device=t.value.trim(); await salvaImp(); }
  else if(t.id==='f-import'){ const f=t.files&&t.files[0]; if(f) await importa(f); t.value=''; } });

// ----- avvio -----
(async function init(){
  try{ await DB.open(); }catch(e){ document.querySelector('main').innerHTML='<div class="warn">Il browser non permette di salvare (IndexedDB bloccato: navigazione privata?). Apri l\'app in una scheda normale.</div>'; return; }
  const s=await DB.getKv('impostazioni'); if(s) S=Object.assign({},S,s); if(S.filtroTotali) filtro=S.filtroTotali;
  S.vivai=normVivai(S.vivai); // v0.1 salvava i vivai come stringhe
  if(!S.device){ S.device='tel-'+Math.random().toString(36).slice(2,6); }
  await salvaImp();
  E=await DB.all('eventi'); E.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  const hm=(location.hash||'').match(/[#&]t=([A-Za-z0-9._-]{6,})/); if(hm){ const c=syncCfg(); c.token=hm[1]; c.lastSeq=0; c.pendenti=E.map(e=>e.id); await salvaImp(); history.replaceState(null,'',location.pathname); toast('Server collegato dal link'); }
  try{ if(navigator.storage&&navigator.storage.persist) persisted=await navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  await migraConfigLocale(); applicaConfig();
  F=nuovoForm(); render(); sync();
  setInterval(()=>{ if(document.visibilityState==='visible'&&navigator.onLine) sync(); },10000);
  window.addEventListener('online',()=>sync()); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
})();
</script>
